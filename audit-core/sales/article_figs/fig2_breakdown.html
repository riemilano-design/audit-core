<!doctype html><html lang='ja'><head><meta charset='utf-8'><title>fig2_breakdown</title><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FBFAF7;--ink:#1C2433;--mut:#566074;--line:#D8D3C8;--soft:#F1EEE6;--acc:#C2402A;--accs:#FBE8E2;--blu:#1F5F8B;--blus:#E5EEF5}
html,body{background:var(--bg)}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.canvas{width:1280px;overflow:hidden;position:relative;background:var(--bg);padding:56px 64px;display:flex;flex-direction:column}
.kick{font-size:28px;font-weight:600;color:var(--blu);letter-spacing:.04em}
h1{font-size:54px;line-height:1.32;font-weight:700;margin-top:14px;letter-spacing:.01em}
h2{font-size:46px;line-height:1.3;font-weight:700}
.sub{font-size:30px;color:var(--mut);margin-top:10px;line-height:1.45}
.foot{font-size:27px;color:var(--mut);line-height:1.5;margin-top:auto;padding-top:22px;border-top:2px solid var(--line)}
.num{font-feature-settings:"tnum";font-variant-numeric:tabular-nums}
.mono{font-family:"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
.acc{color:var(--acc)}
/* 見出し画像 */
.runs{display:flex;gap:24px;margin-top:38px}
.run{flex:1;min-width:0;background:#fff;border:2px solid var(--line);border-radius:18px;padding:24px 26px 26px}
.run .lab{font-size:28px;font-weight:600;color:var(--mut)}
.run .n{font-size:40px;font-weight:700;margin-top:6px}
.run .n b{font-size:76px;font-weight:700;letter-spacing:-.01em}
.run .res{margin-top:12px;font-size:44px;font-weight:700;color:var(--acc);border-top:2px solid var(--line);padding-top:14px;white-space:nowrap}
.run .res small{display:block;font-size:26px;font-weight:600;color:var(--mut);margin-top:2px}
/* 仕組み */
.two{display:flex;gap:28px;margin-top:30px}
.src{flex:1;min-width:0;border-radius:18px;padding:22px 26px}
.src.j{background:var(--blus);border:2px solid var(--blu)}
.src.e{background:#fff;border:2px solid var(--line)}
.src .t{font-size:34px;font-weight:700}
.src .d{font-size:28px;color:var(--mut);margin-top:6px;line-height:1.45}
.src.j .t{color:var(--blu)}
.rows{margin-top:26px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px 26px}
.row{display:flex;align-items:center;gap:0;padding:8px 0}
.row .who{width:150px;font-size:28px;font-weight:600;color:var(--mut);flex:none}
.row .c{flex:1;text-align:center;font-size:40px;font-weight:600;padding:6px 0;border-radius:10px}
.row .c.hit{background:var(--accs);color:var(--acc);outline:3px solid var(--acc)}
.rows .ex{font-size:24px;color:var(--mut);text-align:right;margin-top:4px}
.steps{display:flex;align-items:stretch;gap:0;margin-top:26px}
.step{flex:1;min-width:0;background:var(--soft);border-radius:16px;padding:18px 20px}
.step .k{font-size:26px;font-weight:700;color:var(--blu)}
.step .v{font-size:30px;font-weight:700;margin-top:4px;line-height:1.35}
.step .w{font-size:24px;color:var(--mut);margin-top:6px;line-height:1.4}
.arr{flex:none;width:44px;display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--mut)}
/* 候補から本物まで */
.fun{margin-top:30px;display:flex;flex-direction:column;gap:20px}
.fr{display:flex;align-items:stretch;gap:0}
.fr .who{width:210px;flex:none;display:flex;flex-direction:column;justify-content:center}
.fr .who b{font-size:32px}
.fr .who span{font-size:26px;color:var(--mut)}
.fr .cand{flex:1;min-width:0;display:flex;gap:12px}
.bx{flex:1;min-width:0;background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 20px}
.bx .l{font-size:25px;color:var(--mut);line-height:1.35}
.bx .v{font-size:46px;font-weight:700;margin-top:2px}
.bx .v small{font-size:28px;font-weight:600}
.bx.out{background:var(--soft);border-style:dashed}
.bx.real{flex:none;width:230px;background:var(--accs);border-color:var(--acc)}
.bx.real .l{color:var(--acc);font-weight:600}
.bx.real .v{color:var(--acc)}
/* 内訳 */
.sec{font-size:30px;font-weight:700;color:var(--blu);margin-top:26px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.bars{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.br{display:flex;align-items:center}
.br .nm{width:270px;flex:none;font-size:30px;font-weight:600}
.br .bar{height:44px;background:var(--acc);border-radius:6px;flex:none}
.br .bar.b{background:var(--blu)}
.br .ct{font-size:36px;font-weight:700;margin-left:14px;width:96px;flex:none}
.br .ct small{font-size:24px;font-weight:600;color:var(--mut)}
.br .eg{margin-left:auto;font-size:28px;color:var(--mut);white-space:nowrap}
.br .eg i{font-style:normal;color:var(--acc);font-weight:700}
/* 括弧 */
.big{margin-top:34px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:34px 20px;text-align:center;font-size:72px;font-weight:600;white-space:nowrap}
.big span{background:var(--accs);color:var(--acc);border-radius:12px;padding:2px 14px;outline:3px solid var(--acc)}
.reads{display:flex;gap:28px;margin-top:26px}
.rd{flex:1;min-width:0;border-radius:16px;padding:20px 24px}
.rd.j{background:var(--blus)}
.rd.e{background:var(--accs)}
.rd .l{font-size:27px;font-weight:600;color:var(--mut)}
.rd .v{font-size:40px;font-weight:700;margin-top:6px}
.rd.j .v{color:var(--blu)}
.rd.e .v{color:var(--acc)}
 .canvas{height:960px} </style></head><body><div class='canvas'>
<h2>2 回目(通期 200 本)の 23 欄の内訳</h2>
<div class='sec'>どう違ったか</div>
<div class='bars'><div class='br'><div class='nm'>1 字の違い</div><div class='bar' style='width:380px'></div><div class='ct num'>10 <small>欄</small></div><div class='eg mono'>12,345 → 12,<i>8</i>45</div></div><div class='br'><div class='nm'>数字の入れ替わり</div><div class='bar' style='width:190px'></div><div class='ct num'>5 <small>欄</small></div><div class='eg mono'>12,345 → 12,<i>43</i>5</div></div><div class='br'><div class='nm'>桁</div><div class='bar' style='width:114px'></div><div class='ct num'>3 <small>欄</small></div><div class='eg mono'>12,345 → <i>2,345</i></div></div><div class='br'><div class='nm'>別の数</div><div class='bar' style='width:114px'></div><div class='ct num'>3 <small>欄</small></div><div class='eg mono'>12,345 → <i>13,570</i></div></div><div class='br'><div class='nm'>符号</div><div class='bar' style='width:76px'></div><div class='ct num'>2 <small>欄</small></div><div class='eg mono'>1,234 → <i>(1,234)</i></div></div></div>
<div class='sec'>どこに在ったか</div>
<div class='bars'><div class='br'><div class='nm'>主な財務諸表</div><div class='bar b' style='width:494px'></div><div class='ct num'>13 <small>欄</small></div></div><div class='br'><div class='nm'>セグメントの表</div><div class='bar b' style='width:228px'></div><div class='ct num'>6 <small>欄</small></div></div><div class='br'><div class='nm'>サマリー(1 枚目)</div><div class='bar b' style='width:152px'></div><div class='ct num'>4 <small>欄</small></div></div></div>
<div class='foot'>右の数字は、型を示すための架空の例です(実際の値ではありません)。</div>
</div>
<script>
window.addEventListener('load',function(){
  if(location.hash!=='#chk')return;
  var c=document.querySelector('.canvas'),R=c.getBoundingClientRect(),bad=0,who=[];
  var m=40;
  c.querySelectorAll('*').forEach(function(e){
    var r=e.getBoundingClientRect(); if(!r.width&&!r.height)return;
    if(r.left<R.left+m-0.5||r.right>R.right-m+0.5||r.top<R.top+m-0.5||r.bottom>R.bottom-m+0.5){bad++;who.push('edge:'+(e.className||e.tagName))}
    var p=e.parentElement; if(p&&p!==c){var q=p.getBoundingClientRect();
      if(getComputedStyle(e).display!=='inline'&&(r.left<q.left-1||r.right>q.right+1||r.top<q.top-1||r.bottom>q.bottom+1)){bad++;who.push('parent:'+(e.className||e.tagName))}}
    if(e.scrollWidth>e.clientWidth+1&&e.clientWidth>0&&getComputedStyle(e).display!=='inline'){bad++;who.push('scroll:'+(e.className||e.tagName))}
  });
  var pre=document.createElement('pre');pre.id='out';
  pre.textContent='bad='+bad+' h='+c.scrollHeight+'/'+c.clientHeight+' '+who.join(',');
  document.body.appendChild(pre);
});
</script>
</body></html>
