[metadata]
name = audit-core
version = 0.1.0
description = XBRL audit verification engine (existence and value checks against filed facts).
long_description = file: README.en.md
long_description_content_type = text/markdown
license = Proprietary
classifiers =
    License :: Other/Proprietary License

[options]
python_requires = >=3.9
install_requires =
package_dir =
    audit_core = core/py/audit_core
packages =
    audit_core
    adapters
    adapters.xbrl
    adapters.kokkai
    adapters.shogi

[options.entry_points]
console_scripts =
    audit-core-verify-document = adapters.xbrl.verify_document:main
    audit-core-verify-external = adapters.xbrl.verify_external:main
